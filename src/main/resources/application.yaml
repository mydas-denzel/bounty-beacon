spring:
  application:
    name: bounty-beacon
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bountybeacon}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  polling:
    rate-ms: 3600000 # 1 hour

provider:
  hackerone:
    username: ${H1_USERNAME:}
    api-key: ${H1_API_KEY:}
  bugcrowd:
    api-key: ${BC_API_KEY:}
  intigriti:
    api-key: ${INT_API_KEY:}

notification:
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}

logging:
  level:
    com.bountybeacon: INFO
    org.springframework.web: INFO
