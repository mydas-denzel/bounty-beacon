spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  main:
    allow-bean-definition-overriding: true

app:
  polling:
    rate-ms: 3600000

provider:
  hackerone:
    username: test
    api-key: test
  bugcrowd:
    api-key: test
  intigriti:
    api-key: test

notification:
  discord:
    webhook-url: http://localhost:8080/test
